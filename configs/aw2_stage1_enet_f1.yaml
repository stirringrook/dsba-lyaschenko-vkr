# Stage 1 enet retrain with EXPR best.pt selected by validation
# macro-F1 instead of class-weighted CE. Targets the residual
# F1_EXPR shortfall identified in Sprint A (-0.167 vs Paper A on enet)
# without changing data or hyperparameters elsewhere.
run_name: aw2_stage1_enet_f1

seed: 42

data:
  root: ../competition-data
  cropped_aligned_dir: ../competition-data/cropped_aligned
  train_annotations: ../competition-data/training_set_annotations.txt
  val_annotations:   ../competition-data/validation_set_annotations.txt
  num_aus: 12
  num_expr: 8

backbone:
  model_name: enet_b0_8_va_mtl
  engine: torch
  feature_dim: 1280
  scores_dim: 10

head:
  au_hidden: 128
  l2_reg: 0.001953125
  expr_select_by: f1_macro    # default elsewhere is val_loss

train:
  optimizer: adam
  learning_rate: 1.0e-3
  batch_size: 512
  epochs_expr: 10
  epochs_va:   20
  epochs_au:   10
  num_workers: 4
  device: cuda

features_cache: cache/features/enet_b0_8_va_mtl

smoothing:
  enabled: false
  sigma: 100000
  delta: 50
  apply_to: [expr, va]

output:
  results_dir: results/aw2_stage1_enet_f1
