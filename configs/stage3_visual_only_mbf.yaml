# Stage 3 visual-only control on the MBF backbone, used to score the MBF
# bimodal F4 ablation against an apples-to-apples MBF unimodal baseline.
run_name: stage3_visual_only_mbf

seed: 42
data:
  train_annotations: data/affwild2/annotations/training_set_annotations.txt
  val_annotations:   data/affwild2/annotations/validation_set_annotations.txt
  num_aus: 12
  num_expr: 8
visual:
  backbone: mbf_va_mtl
  features_cache: cache/features/mbf_va_mtl
  feature_dim: 512
  scores_dim: 10
audio:
  backbone: hubert_large
  aligned_dir: cache/features/hubert_large_aligned_mbf
  feature_dim: 1024
head:
  au_hidden: 128

fusion:
  variant: visual_only
  hidden: 384
  dropout: 0.3

train:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-3
  batch_size: 256
  epochs: 3
  num_workers: 0
  device: cuda
  loss_weights: { expr: 1.0, va: 1.0, au: 1.0 }

output:
  results_dir: results/stage3_visual_only_mbf
