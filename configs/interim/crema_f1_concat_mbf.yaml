# Backbone ablation: F1 fusion with the lighter 512-D MobileFaceNet visual
# trunk instead of the 1280-D EfficientNet one.
run_name: crema_f1_concat_mbf

seed: 42
data:
  train_annotations: data/crema_d/annotations/train.txt
  val_annotations:   data/crema_d/annotations/val.txt
  num_aus: 12
  num_expr: 8
visual:
  backbone: mbf_va_mtl
  features_cache: cache/features/crema_d/mbf_va_mtl
  feature_dim: 512
  scores_dim: 10
audio:
  backbone: hubert_large
  aligned_dir: cache/features/crema_d/hubert_large_aligned
  feature_dim: 1024
head:
  au_hidden: 128

fusion:
  variant: f1_concat
  hidden: 384
  dropout: 0.3

train:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 15
  num_workers: 4
  device: cuda
  loss_weights: { expr: 1.0, va: 1.0, au: 0.0 }

output:
  results_dir: results/interim/crema_f1_concat_mbf
