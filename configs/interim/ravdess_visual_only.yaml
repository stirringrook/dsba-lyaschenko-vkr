run_name: ravdess_visual_only

seed: 42
data:
  train_annotations: data/ravdess/annotations/train.txt
  val_annotations:   data/ravdess/annotations/val.txt
  num_aus: 12
  num_expr: 8
visual:
  backbone: enet_b0_8_va_mtl
  features_cache: cache/features/ravdess/enet_b0_8_va_mtl
  feature_dim: 1280
  scores_dim: 10
audio:
  backbone: hubert_large
  aligned_dir: cache/features/ravdess/hubert_large_aligned
  feature_dim: 1024
head:
  au_hidden: 128

fusion:
  variant: visual_only
  hidden: 384
  dropout: 0.3

train:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 256
  epochs: 15
  num_workers: 4
  device: cuda
  loss_weights: { expr: 1.0, va: 1.0, au: 0.0 }

output:
  results_dir: results/interim/ravdess_visual_only
