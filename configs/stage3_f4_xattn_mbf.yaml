# S7 ablation: F4 with the MobileFaceNet visual backbone instead of enet.
# Requires cache/features/hubert_large_aligned_mbf/ which is materialised
# in the aw2_06 notebook (audio aligned to MBF's per-video frame timeline,
# in case MBF and enet picked different image_names per video).
run_name: stage3_f4_xattn_mbf

seed: 42
data:
  train_annotations: data/affwild2/annotations/training_set_annotations.txt
  val_annotations:   data/affwild2/annotations/validation_set_annotations.txt
  num_aus: 12
  num_expr: 8
visual:
  backbone: mbf_va_mtl
  features_cache: cache/features/mbf_va_mtl
  feature_dim: 512           # MobileFaceNet feature dim
  scores_dim: 10
audio:
  backbone: hubert_large
  aligned_dir: cache/features/hubert_large_aligned_mbf
  feature_dim: 1024
head:
  au_hidden: 128

fusion:
  variant: f4_xattn
  hidden: 256
  dropout: 0.1
  num_heads: 4
  window: 5

train:
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-3
  batch_size: 128
  epochs: 3
  num_workers: 0
  device: cuda
  loss_weights: { expr: 1.0, va: 1.0, au: 1.0 }

output:
  results_dir: results/stage3_f4_xattn_mbf
