# Stage 2 - audio-only MTL baseline (wav2vec 2.0 base).
# Secondary (tighter efficiency) audio backbone.
run_name: stage2_audio_wav2vec2
seed: 42

data:
  root: data/affwild2
  train_annotations: data/affwild2/annotations/training_set_annotations.txt
  val_annotations:   data/affwild2/annotations/validation_set_annotations.txt
  num_aus: 12
  num_expr: 8

modality: audio

audio:
  backbone: wav2vec2_base           # facebook/wav2vec2-base-960h
  feature_dim: 768
  wav_dir:          cache/audio_wav
  raw_features_dir: cache/features/wav2vec2_base
  aligned_dir:      cache/features/wav2vec2_base_aligned

visual:
  features_cache: cache/features/enet_b0_8_va_mtl

head:
  au_hidden: 128
  l2_reg: 0.001953125

train:
  optimizer: adam
  learning_rate: 1.0e-3
  batch_size: 512
  epochs_expr: 10
  epochs_va:   20
  epochs_au:   10
  device: cuda

output:
  results_dir: results/stage2_audio_wav2vec2
