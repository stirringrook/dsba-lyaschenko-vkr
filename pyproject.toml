[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-code"
version = "0.1.0"
description = "Efficient multi-task bimodal emotion recognition for ABAW"
requires-python = ">=3.10"
authors = [{ name = "Andrew" }]
readme = "README.md"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10",
    "opencv-python>=4.8",
    "tqdm>=4.66",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# EmotiEffLib is a sibling clone at ../EmotiEffLib-main. Install it separately:
#   pip install -e ../EmotiEffLib-main
# Stage 2+ extras (kept optional so Stage 1 stays light):
audio = [
    "transformers>=4.40",
    "torchaudio>=2.2",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
